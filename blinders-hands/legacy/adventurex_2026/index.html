<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>空间感知助手</title>
<style>
  body { font-family: -apple-system, sans-serif; text-align: center; padding-top: 80px; background: #f5f5f7; }
  #btn { width: 160px; height: 160px; border-radius: 50%; background: #007aff; color: white;
         font-size: 20px; border: none; cursor: pointer; user-select: none; }
  #btn:active { background: #005ecb; transform: scale(0.96); }
  #status { margin-top: 30px; font-size: 18px; color: #333; min-height: 30px; padding: 0 20px; }
  #confirm { margin-top: 20px; }
  #confirm button { padding: 10px 24px; font-size: 16px; border-radius: 8px; border: none; cursor: pointer; }
  .yes { background: #34c759; color: white; }
</style>
</head>
<body>
  <button id="btn">按住说话</button>
  <div id="status">按住按钮,说出你的需求</div>
  <div id="confirm" style="display:none;">
    <button class="yes" onclick="onConfirm()">是的</button>
  </div>

<script>
const btn = document.getElementById('btn');
const statusEl = document.getElementById('status');
const confirmEl = document.getElementById('confirm');

const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = 'zh-CN';
recognition.interimResults = false;

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN';
  speechSynthesis.speak(u);
}

function beep() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  osc.frequency.value = 880;
  osc.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.15);
}

btn.addEventListener('mousedown', () => {
  beep();
  statusEl.textContent = "正在聆听...";
  confirmEl.style.display = 'none';
  recognition.start();
});

recognition.onresult = async (event) => {
  const text = event.results[0][0].transcript;
  statusEl.textContent = `你说: ${text}`;
  beep();

  const thinkingMsg = "理解中...";
  statusEl.textContent += ` | ${thinkingMsg}`;
  speak(thinkingMsg);

  const resp = await fetch('/understand', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text})
  });
  const data = await resp.json();
  statusEl.textContent = data.question;
  speak(data.question);
  confirmEl.style.display = 'block';
};

recognition.onerror = (e) => {
  statusEl.textContent = "没有识别到语音,请重试";
};

async function onConfirm() {
  confirmEl.style.display = 'none';
  statusEl.textContent = "正在查看,请稍候...";
  speak("好的,我这就去看看");

  const resp = await fetch('/execute', { method: 'POST' });
  const data = await resp.json();
  statusEl.textContent = data.result;
  speak(data.result);
}
</script>
</body>
</html>
